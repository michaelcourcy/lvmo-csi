{{- $v := .Values -}}
{{- $name := printf "%s-storage" .Release.Name -}}
{{- $old := lookup "apps/v1" "Deployment" .Release.Namespace $name -}}
{{- $address := printf "%s.%s.svc" $name .Release.Namespace -}}
{{- $prefix := index $v "dest-storage-class-prefix" | default .Release.Name -}}
{{- $image := printf "%s:%s" $v.image.repository ($v.image.tag | default .Chart.AppVersion) -}}
{{- $vg := printf "lvmo-%s" (sha256sum (printf "%s/%s" .Release.Namespace .Release.Name) | trunc 12) -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $prefix) }}{{ fail "invalid destination StorageClass prefix" }}{{ end }}
{{- if gt (len $prefix) 55 }}{{ fail "destination prefix too long" }}{{ end }}
{{- if not (regexMatch "^[1-9][0-9]*(Gi|G|Mi|M)$" $v.size) }}{{ fail "size must be a positive Kubernetes quantity, e.g. 5Gi" }}{{ end }}
{{- $_ := required "source-storage-class is required" (index $v "source-storage-class") }}
{{- $_ := required "storage server image.repository is required" $v.image.repository }}
{{- $source := lookup "storage.k8s.io/v1" "StorageClass" "" (index $v "source-storage-class") }}
{{- if or (eq (index $v "source-storage-class") (printf "%s-nfs" $prefix)) (eq (index $v "source-storage-class") (printf "%s-iscsi" $prefix)) (and $source (eq $source.provisioner "lvmo.csi.io")) }}{{ fail "source StorageClass must be independent of lvmo" }}{{ end }}
{{- if $old }}
{{- $a := $old.metadata.annotations }}
{{- if or (ne (index $a "lvmo.csi.io/source-class") (index $v "source-storage-class")) (ne (index $a "lvmo.csi.io/size") $v.size) (ne (index $a "lvmo.csi.io/prefix") $prefix) (ne (index $a "lvmo.csi.io/address") $address) }}{{ fail "test server backing identity is immutable; clean up before migration" }}{{ end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app: {{ $name }}
  ports:
  - name: api
    port: 50051
    targetPort: 50051
  - name: nfs
    port: 2049
    targetPort: 2049
  - name: iscsi
    port: 3260
    targetPort: 3260
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: {{ index $v "source-storage-class" | quote }}
  resources:
    requests:
      storage: {{ $v.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  annotations:
    lvmo.csi.io/source-class: {{ index $v "source-storage-class" | quote }}
    lvmo.csi.io/size: {{ $v.size | quote }}
    lvmo.csi.io/prefix: {{ $prefix | quote }}
    lvmo.csi.io/address: {{ $address | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 120
      containers:
      - name: server
        image: {{ $image | quote }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: VG
          value: {{ $vg }}
        - name: SERVER
          value: {{ $address | quote }}
        - name: BACKING_SIZE
          value: {{ $v.size | quote }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 3
        {{- with $v.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: backing
          mountPath: /backing
        - name: dev
          mountPath: /dev
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: configfs
          mountPath: /sys/kernel/config
      volumes:
      - name: backing
        persistentVolumeClaim:
          claimName: {{ $name }}
      - name: dev
        hostPath:
          path: /dev
      - name: modules
        hostPath:
          path: /lib/modules
      - name: configfs
        hostPath:
          path: /sys/kernel/config
{{- range $protocol := list "iscsi" "nfs" }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $prefix }}-{{ $protocol }}
  {{- if eq $protocol "iscsi" }}
  # Kasten block-mode export is validated for iSCSI only; NFS cannot be
  # restored from a block export.
  annotations:
    k10.kasten.io/sc-supports-block-mode-exports: "true"
  {{- end }}
provisioner: lvmo.csi.io
parameters:
  endpoint: {{ printf "%s:50051" $address | quote }}
  vg: {{ $vg }}
  protocol: {{ $protocol }}
  filesystem: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-pre-delete
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: {{ $name }}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: guard
        image: {{ $image | quote }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        args: [guard]
        env:
        - name: VG
          value: {{ $vg }}
        - name: SERVER
          value: {{ $address | quote }}
        volumeMounts:
        - name: backing
          mountPath: /backing
          readOnly: true
      volumes:
      - name: backing
        persistentVolumeClaim:
          claimName: {{ $name }}
