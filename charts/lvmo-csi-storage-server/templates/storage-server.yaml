{{- $v := .Values -}}
{{- $name := printf "%s-storage" .Release.Name -}}
{{- $old := lookup "apps/v1" "Deployment" .Release.Namespace $name -}}
{{- $address := printf "%s.%s.svc" $name .Release.Namespace -}}
{{- $prefix := index $v "dest-storage-class-prefix" | default .Release.Name -}}
{{- $image := printf "%s:%s" $v.image.repository ($v.image.tag | default .Chart.AppVersion) -}}
{{- $vg := printf "lvmo-%s" (sha256sum (printf "%s/%s" .Release.Namespace .Release.Name) | trunc 12) -}}
{{- $block := index $v "block-mode" | default false -}}
{{- if not (kindIs "bool" $block) }}{{ fail "block-mode must be true or false" }}{{ end }}
{{- /* Defaults here too: --reuse-values upgrades do not see new chart defaults. */}}
{{- $stateSize := index $v "state-size" | default "1Gi" -}}
{{- $stateClaim := ternary (printf "%s-state" $name) $name $block -}}
{{- $tls := $v.tls | default dict -}}
{{- $tlsEnabled := dig "enabled" true $tls -}}
{{- if not (kindIs "bool" $tlsEnabled) }}{{ fail "tls.enabled must be true or false" }}{{ end }}
{{- $tlsIssuer := $tls.issuer | default "lvmo-csi-api" -}}
{{- $tlsSecret := $tls.existingSecret | default (printf "%s-api-tls" $name) -}}
{{- $tlsClientCA := $tls.clientCA | default "" -}}
{{- if and $tlsEnabled (not $tls.existingSecret) }}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}{{ fail "cert-manager is missing. The API uses mutual TLS with a certificate from cert-manager: install cert-manager, then the lvmo-csi driver chart (it creates the ClusterIssuer), then this chart. Or set tls.existingSecret, or tls.enabled=false for a driver installed with apiTLS.enabled=false." }}{{ end }}
{{- /*
The server admits only clients signed by the driver CA, which lives in the
driver's namespace, named by the ClusterIssuer's annotation. Only its public
certificate is copied. lookup returns nothing offline (helm template): then
tls.clientCA must give it.
*/}}
{{- if lookup "v1" "Namespace" "" "kube-system" }}
{{- $issuer := lookup "cert-manager.io/v1" "ClusterIssuer" "" $tlsIssuer }}
{{- if not $issuer }}{{ fail (printf "ClusterIssuer %s not found: install the lvmo-csi driver chart first, with apiTLS enabled" $tlsIssuer) }}{{ end }}
{{- if not $tlsClientCA }}
{{- $driverNamespace := index ($issuer.metadata.annotations | default dict) "lvmo.csi.io/driver-namespace" }}
{{- if not $driverNamespace }}{{ fail (printf "ClusterIssuer %s has no lvmo.csi.io/driver-namespace annotation: upgrade the lvmo-csi driver chart, or set tls.clientCA" $tlsIssuer) }}{{ end }}
{{- $ca := lookup "v1" "Secret" $driverNamespace (printf "%s-driver-ca" $tlsIssuer) }}
{{- if not $ca }}{{ fail (printf "Driver CA Secret %s/%s-driver-ca not found: wait until cert-manager has issued it (helm install of the driver with --wait), then retry" $driverNamespace $tlsIssuer) }}{{ end }}
{{- $tlsClientCA = index $ca.data "ca.crt" | b64dec }}
{{- end }}
{{- end }}
{{- if not (contains "BEGIN CERTIFICATE" $tlsClientCA) }}{{ fail (printf "tls.clientCA is required when rendering offline (helm template): pass the driver CA with --set-file tls.clientCA=driver-ca.crt, extracted with: kubectl -n <driver-namespace> get secret %s-driver-ca -o jsonpath='{.data.ca\\.crt}' | base64 -d" $tlsIssuer) }}{{ end }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $prefix) }}{{ fail "invalid destination StorageClass prefix" }}{{ end }}
{{- if gt (len $prefix) 55 }}{{ fail "destination prefix too long" }}{{ end }}
{{- if not (regexMatch "^[1-9][0-9]*(Gi|G|Mi|M)$" $v.size) }}{{ fail "size must be a positive Kubernetes quantity, e.g. 5Gi" }}{{ end }}
{{- if not (regexMatch "^[1-9][0-9]*(Gi|G|Mi|M)$" $stateSize) }}{{ fail "state-size must be a positive Kubernetes quantity, e.g. 1Gi" }}{{ end }}
{{- $_ := required "source-storage-class is required" (index $v "source-storage-class") }}
{{- $_ := required "storage server image.repository is required" $v.image.repository }}
{{- $source := lookup "storage.k8s.io/v1" "StorageClass" "" (index $v "source-storage-class") }}
{{- if or (eq (index $v "source-storage-class") (printf "%s-nfs" $prefix)) (eq (index $v "source-storage-class") (printf "%s-iscsi" $prefix)) (and $source (eq $source.provisioner "lvmo.csi.io")) }}{{ fail "source StorageClass must be independent of lvmo" }}{{ end }}
{{- /* Two zonal PVCs bound independently could land in different zones. */}}
{{- if and $block $source (ne ($source.volumeBindingMode | default "Immediate") "WaitForFirstConsumer") }}{{ fail (printf "block-mode requires a WaitForFirstConsumer source StorageClass: %s binds Immediate, so its block and state PVCs could be placed apart" $source.metadata.name) }}{{ end }}
{{- if $old }}
{{- $a := $old.metadata.annotations }}
{{- if or (ne (index $a "lvmo.csi.io/source-class") (index $v "source-storage-class")) (ne (index $a "lvmo.csi.io/size") $v.size) (ne (index $a "lvmo.csi.io/prefix") $prefix) (ne (index $a "lvmo.csi.io/address") $address) (ne (index $a "lvmo.csi.io/block-mode" | default "false") (toString $block)) (and $block (ne (index $a "lvmo.csi.io/state-size") $stateSize)) }}{{ fail "test server backing identity is immutable; clean up before migration" }}{{ end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app: {{ $name }}
  ports:
  - name: api
    port: 50051
    targetPort: 50051
  - name: nfs
    port: 2049
    targetPort: 2049
  - name: iscsi
    port: 3260
    targetPort: 3260
---
{{- if and $tlsEnabled (not $tls.existingSecret) }}
# The driver CA: the only issuer of client certificates the server admits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-api-client-ca
data:
  ca.crt: |
    {{- $tlsClientCA | trim | nindent 4 }}
---
# Server authentication only, for the names the generated StorageClasses use.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tlsSecret }}
spec:
  secretName: {{ $tlsSecret }}
  commonName: {{ $address }}
  dnsNames:
  - {{ $name }}
  - {{ $name }}.{{ .Release.Namespace }}
  - {{ $address }}
  - {{ $address }}.cluster.local
  duration: 2160h
  renewBefore: 720h
  usages: [digital signature, server auth]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {kind: ClusterIssuer, name: {{ $tlsIssuer }}}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: {{ ternary "Block" "Filesystem" $block }}
  storageClassName: {{ index $v "source-storage-class" | quote }}
  resources:
    requests:
      storage: {{ $v.size }}
---
{{- if $block }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $stateClaim }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: {{ index $v "source-storage-class" | quote }}
  resources:
    requests:
      storage: {{ $stateSize }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  annotations:
    lvmo.csi.io/source-class: {{ index $v "source-storage-class" | quote }}
    lvmo.csi.io/size: {{ $v.size | quote }}
    lvmo.csi.io/prefix: {{ $prefix | quote }}
    lvmo.csi.io/address: {{ $address | quote }}
    lvmo.csi.io/block-mode: {{ toString $block | quote }}
    {{- if $block }}
    lvmo.csi.io/state-size: {{ $stateSize | quote }}
    {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 120
      {{- if $block }}
      # A container that mounts the host /dev does not get its volumeDevices
      # node on every runtime (containerd skips it). This one has no /dev
      # mount; it records the device number for the server to recreate it.
      initContainers:
      - name: block-device
        image: {{ $image | quote }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        command: [bash, -c, "stat -c '%t %T' /lvmo-dev/backing >/lvmo-dev-info/number"]
        volumeDevices:
        - name: backing-device
          devicePath: /lvmo-dev/backing
        volumeMounts:
        - name: block-info
          mountPath: /lvmo-dev-info
      {{- end }}
      containers:
      - name: server
        image: {{ $image | quote }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: VG
          value: {{ $vg }}
        - name: SERVER
          value: {{ $address | quote }}
        {{- if $block }}
        - name: BLOCK_DEVICE
          value: /lvmo-dev/backing
        - name: BLOCK_DEVICE_NUMBER
          value: /lvmo-dev-info/number
        {{- else }}
        - name: BACKING_SIZE
          value: {{ $v.size | quote }}
        {{- end }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- if $tlsEnabled }}
        - name: TLS_DIR
          value: /api-tls
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 3
        {{- with $v.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: backing
          mountPath: /backing
        - name: dev
          mountPath: /dev
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: configfs
          mountPath: /sys/kernel/config
        {{- if $tlsEnabled }}
        - name: api-tls
          mountPath: /api-tls
          readOnly: true
        {{- end }}
        {{- if $block }}
        - name: block-info
          mountPath: /lvmo-dev-info
          readOnly: true
        {{- end }}
      volumes:
      - name: backing
        persistentVolumeClaim:
          claimName: {{ $stateClaim }}
      {{- if $block }}
      - name: backing-device
        persistentVolumeClaim:
          claimName: {{ $name }}
      - name: block-info
        emptyDir: {}
      {{- end }}
      - name: dev
        hostPath:
          path: /dev
      - name: modules
        hostPath:
          path: /lib/modules
      - name: configfs
        hostPath:
          path: /sys/kernel/config
      {{- if $tlsEnabled }}
      - name: api-tls
        {{- if $tls.existingSecret }}
        secret:
          secretName: {{ $tlsSecret }}
        {{- else }}
        projected:
          sources:
          - secret:
              name: {{ $tlsSecret }}
              items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
          - configMap:
              name: {{ $name }}-api-client-ca
              items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
      {{- end }}
{{- range $protocol := list "iscsi" "nfs" }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $prefix }}-{{ $protocol }}
  {{- if eq $protocol "iscsi" }}
  # Kasten block-mode export is validated for iSCSI only; NFS cannot be
  # restored from a block export.
  annotations:
    k10.kasten.io/sc-supports-block-mode-exports: "true"
  {{- end }}
provisioner: lvmo.csi.io
parameters:
  endpoint: {{ printf "%s:50051" $address | quote }}
  vg: {{ $vg }}
  protocol: {{ $protocol }}
  filesystem: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-pre-delete
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: {{ $name }}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: guard
        image: {{ $image | quote }}
        imagePullPolicy: {{ $v.image.pullPolicy }}
        args: [guard]
        env:
        - name: VG
          value: {{ $vg }}
        - name: SERVER
          value: {{ $address | quote }}
        volumeMounts:
        - name: backing
          mountPath: /backing
          readOnly: true
      volumes:
      - name: backing
        persistentVolumeClaim:
          claimName: {{ $stateClaim }}
