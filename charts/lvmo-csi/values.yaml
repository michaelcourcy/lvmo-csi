image:
  repository: michaelcourcy/lvmo-csi
  # Empty uses Chart.appVersion; set a tag to override it.
  tag: ""
  pullPolicy: IfNotPresent
# Optional fallback for legacy handles and standalone deployments.
# New StorageClasses select their backend with parameters.endpoint.
apiEndpoint: ""
# Mutual TLS on the storage servers' management API. Without it, any pod that
# can reach a storage server's API port can read, attach and delete volumes.
# By default cert-manager issues the certificates: install it first. The chart
# creates two CAs. The server CA, in cert-manager's namespace, with a
# ClusterIssuer that signs the storage servers' certificates (the
# lvmo-csi-storage-server chart uses it). The driver CA, with an Issuer of this
# namespace only, that signs the driver's client certificate: a certificate
# obtained from the ClusterIssuer cannot act as the driver.
# docs/pod-storage-server.md#mutual-tls explains it; docs/storage-server.md
# explains how to give a standalone server its certificate.
apiTLS:
  enabled: true
  # ClusterIssuer created by this chart, and prefix of its CAs' resources.
  issuer: lvmo-csi-api
  # cert-manager's cluster resource namespace (its --cluster-resource-namespace).
  certManagerNamespace: cert-manager
  # Instead of cert-manager: a Secret in the release namespace with the
  # driver's client certificate (tls.crt, tls.key) and the CA bundle that
  # signs the storage servers' certificates (ca.crt).
  existingSecret: ""
kubeletRoot: /var/lib/kubelet
openshift: false
metadata:
  enabled: false
  image: registry.k8s.io/sig-storage/csi-snapshot-metadata:v1.0.0
  tlsSecret: lvmo-metadata-tls
  audience: lvmo.csi.io
  caCert: ""
sidecars:
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.0.0
  attacher: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  snapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
  resizer: registry.k8s.io/sig-storage/csi-resizer:v2.0.0
  registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0

# Before the node plugin starts on a node, check that the node can serve iSCSI
# volumes: the host's iscsid answers and the iscsi_tcp module can be loaded.
# lvmo loads the module and uses its own initiator name, kept in
# /var/lib/lvmo-node; the host only needs open-iscsi (docs/nodes.md). A node
# that fails keeps its node plugin in Init until it is fixed. Set false only if
# the cluster uses NFS volumes alone.
nodeCheck:
  iscsi: true

# Only for nested Kind tests; leave empty on real Kubernetes nodes.
iscsiHostProc: ""
# Move workloads off a failed node without an out-of-service taint. A node is
# declared dead when Kubernetes reports it not Ready and its node plugin has
# sent no heartbeat to the storage servers, both for `timeout`. It is fenced at
# the storage servers before its pods using lvmo volumes are force-deleted.
failover:
  enabled: true
  timeout: 120s

# Shared by every backend managed by this driver. Install snapshot CRDs first,
# or explicitly disable class creation when snapshots are managed elsewhere.
snapshotClass:
  enabled: true
  name: lvmo-snapshots
  deletionPolicy: Delete
  kasten: true
