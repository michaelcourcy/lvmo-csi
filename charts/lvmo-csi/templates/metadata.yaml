{{- if .Values.metadata.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: lvmo-metadata
spec:
  selector: {app: lvmo-controller}
  ports:
  - {name: grpc, port: 6443, targetPort: metadata}
---
apiVersion: cbt.storage.k8s.io/v1beta1
kind: SnapshotMetadataService
metadata:
  name: lvmo.csi.io
  labels:
    csi.storage.k8s.io/driver-name: lvmo.csi.io
spec:
  address: lvmo-metadata.{{ .Release.Namespace }}.svc:6443
  audience: {{ .Values.metadata.audience | quote }}
  caCert: {{ required "metadata.caCert must contain the base64-encoded CA certificate" .Values.metadata.caCert | quote }}
{{- end }}
