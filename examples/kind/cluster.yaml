kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
  - hostPath: /proc
    containerPath: /run/lvmo-host-proc
    readOnly: true
  # Use a real host filesystem, not the Kind container's overlay filesystem.
  - hostPath: /var/lib/lvmo-kind-source
    containerPath: /var/local-path-provisioner
