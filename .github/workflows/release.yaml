name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    - uses: azure/setup-helm@v4.3.0
      with: {version: v3.17.3}
    - run: make test lint release-binaries VERSION="${GITHUB_REF_NAME}"
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        # The release repository is fixed; the secrets only provide the login,
        # which may be a collaborator account.
        tags: michaelcourcy/lvmo-csi:${{ github.ref_name }}
        build-args: VERSION=${{ github.ref_name }}
    - name: Publish storage-server image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.storage-server
        platforms: linux/amd64,linux/arm64
        push: true
        tags: michaelcourcy/lvmo-csi-storage-server:${{ github.ref_name }}
    # A tag with a suffix (v0.1.0-alpha.3, v1.0.0-rc.1) is a pre-release.
    - run: |
        prerelease=""
        if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=--prerelease; fi
        gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $prerelease
      env:
        GH_TOKEN: ${{ github.token }}
    # The Helm repository is index.yaml on gh-pages, served by GitHub Pages;
    # its entries point to the charts attached to the GitHub releases.
    - name: Add the chart to the Helm repository index
      run: |
        git fetch origin gh-pages:refs/remotes/origin/gh-pages
        git worktree add pages origin/gh-pages
        mkdir chart && cp dist/*.tgz chart/
        helm repo index chart --merge pages/index.yaml \
          --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        cp chart/index.yaml pages/index.yaml
        cd pages
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add index.yaml
        git commit -m "Add chart for ${GITHUB_REF_NAME}"
        git push origin HEAD:gh-pages
