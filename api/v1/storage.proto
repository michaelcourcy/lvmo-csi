syntax = "proto3";
package lvmo.v1;
option go_package = "github.com/michaelcourcy/lvmo-csi/api/v1;storage";
service Storage {
  rpc AcquireVolume(VolumeLease) returns (Empty);
  rpc ReleaseVolume(VolumeLease) returns (Empty);
 rpc CreateVolume(CreateVolumeRequest) returns (Volume);
 rpc GetVolume(ID) returns (Volume);
 rpc DeleteVolume(ID) returns (Empty);
 rpc ExpandVolume(ExpandRequest) returns (Volume);
 rpc ListVolumes(Empty) returns (Volumes);
 rpc CreateSnapshot(SnapshotRequest) returns (Snapshot);
 rpc DeleteSnapshot(ID) returns (Empty);
 rpc ListSnapshots(Empty) returns (Snapshots);
 rpc GetCapacity(CapacityRequest) returns (Capacity);
 rpc Metadata(MetadataRequest) returns (stream Ranges);
}
message Empty {}
message ID { string id = 1; }
message CreateVolumeRequest { string name = 1; int64 bytes = 2; string vg = 3; string protocol = 4; string filesystem = 5; string source_snapshot = 6; string source_volume = 7; bool block = 8; }
message Volume { string id = 1; string name = 2; int64 bytes = 3; string vg = 4; string protocol = 5; string filesystem = 6; string server = 7; string path = 8; string iqn = 9; string lineage = 10; bool block = 11; string source_snapshot = 12; string source_volume = 13; bool ready = 14; }
message Volumes { repeated Volume volumes = 1; }
message ExpandRequest { string id = 1; int64 bytes = 2; }
message SnapshotRequest { string name = 1; string volume_id = 2; }
message Snapshot { string id = 1; string name = 2; string volume_id = 3; string vg = 4; int64 bytes = 5; int64 created_unix = 6; string filesystem = 7; string lineage = 8; bool ready = 9; }
message Snapshots { repeated Snapshot snapshots = 1; }
message CapacityRequest { string vg = 1; }
message Capacity { int64 available_bytes = 1; }
message MetadataRequest { string snapshot = 1; string base_snapshot = 2; int64 starting_offset = 3; int32 max_results = 4; }
message Range { int64 offset = 1; int64 length = 2; }
message Ranges { int64 capacity = 1; repeated Range ranges = 2; }

message VolumeLease { string volume_id = 1; string node_id = 2; }
